<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="position-relative my-4">
            <img src="images/bank-logo.png" alt="Bank Logo" class="bank-logo position-absolute start-0 top-50 translate-middle-y">
            <h1 class="text-center mb-0 header-title">HR Dashboard</h1>
        </div>

        <div id="hrLoginCard" class="card mb-4" style="max-width: 500px; margin: 0 auto;">
            <div class="card-body">
                <div id="hrStatus"></div>
                <div class="mb-3">
                    <label class="form-label">HR code</label>
                    <input type="text" class="form-control" id="hrCode" placeholder="Enter your HR code">
                </div>
                <div class="mb-3">
                    <label class="form-label">HR name</label>
                    <input type="text" class="form-control" id="hrName" placeholder="Enter your name">
                </div>
                <button class="btn btn-primary w-100" id="hrVerifyBtn">View responses</button>
            </div>
        </div>

        <div id="dashboardSection" class="d-none">
            <div id="loadingMsg" class="text-muted">Loading survey responses...</div>
            <div id="errorMsg" class="alert alert-danger d-none"></div>

            <div class="table-responsive d-none" id="tableWrapper">
                <table class="table table-striped table-bordered align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Employee Code</th>
                            <th>Name</th>
                            <th>Governorate</th>
                            <th>Area</th>
                            <th>Street</th>
                            <th>Pickup Point</th>
                            <th>Trip Time</th>
                            <th>Monthly Cost</th>
                            <th>Transport Method</th>
                            <th>Bank Transport</th>
                            <th>Carpooling</th>
                            <th>Challenges</th>
                            <th>Suggestions</th>
                            <th>Comments</th>
                        </tr>
                    </thead>
                    <tbody id="surveyTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="hr.js"></script>
</body>
</html>
