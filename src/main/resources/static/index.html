<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transportation Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="position-relative my-4">
            <img src="images/bank-logo.png" alt="Bank Logo" class="bank-logo position-absolute start-0 top-50 translate-middle-y">
            <h1 class="text-center mb-0 header-title">Transportation Survey</h1>
        </div>

        <div class="row justify-content-center g-4 mt-4">
            <div class="col-12 col-md-5">
                <a href="survey.html" class="choice-card card text-decoration-none">
                    <div class="card-body text-center py-5">
                        <div class="choice-icon mb-3">👤</div>
                        <h2 class="h4 mb-2 text-dark">Employee Survey</h2>
                        <p class="text-muted mb-0">Submit or update your transportation preferences</p>
                    </div>
                </a>
            </div>

            <div class="col-12 col-md-5">
                <a href="hr.html" class="choice-card card text-decoration-none">
                    <div class="card-body text-center py-5">
                        <div class="choice-icon mb-3">📊</div>
                        <h2 class="h4 mb-2 text-dark">HR Dashboard</h2>
                        <p class="text-muted mb-0">View all submitted survey responses</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
