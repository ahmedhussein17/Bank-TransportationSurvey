<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transportation Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="position-relative my-4">
            <img src="images/bank-logo.png" alt="Bank Logo" class="bank-logo position-absolute start-0 top-50 translate-middle-y">
            <h1 class="text-center mb-0 header-title">Transportation Survey</h1>
        </div>

        <div class="card mx-auto" style="max-width: 480px;">
            <div class="card-body">
                <div id="entryStatus"></div>

                <div class="mb-3">
                    <label class="form-label">Employee code</label>
                    <input type="text" class="form-control" id="entryCode" placeholder="Enter your code">
                </div>

                <div class="mb-3">
                    <label class="form-label">Employee name</label>
                    <input type="text" class="form-control" id="entryName" placeholder="Enter your name">
                </div>
                
                <button class="btn btn-primary w-100" id="entryBtn">Continue</button>
            </div>
        </div>
    </div>

    <script src="entry.js"></script>
</body>
</html>
